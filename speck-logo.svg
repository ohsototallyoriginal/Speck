<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3a1240"/>
      <stop offset=".55" stop-color="#1a0a1e"/>
      <stop offset="1" stop-color="#0a040c"/>
    </radialGradient>
    <radialGradient id="giant" cx="50%" cy="85%" r="75%">
      <stop offset="0" stop-color="#ff7ae3"/>
      <stop offset=".5" stop-color="#d12fae"/>
      <stop offset="1" stop-color="#5a1260"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#5ce1ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff4fd8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#bg)"/>
  <!-- the giant: a vast curve looming from above -->
  <circle cx="512" cy="-250" r="700" fill="url(#giant)"/>
  <circle cx="512" cy="-250" r="700" fill="none" stroke="#ffc2f2" stroke-opacity=".55" stroke-width="10"/>
  <!-- floor line -->
  <rect x="192" y="792" width="640" height="6" rx="3" fill="url(#floor)"/>
  <!-- the speck -->
  <circle cx="512" cy="742" r="150" fill="url(#glow)"/>
  <circle cx="512" cy="742" r="34" fill="#e9fbff"/>
  <circle cx="512" cy="742" r="34" fill="none" stroke="#5ce1ff" stroke-width="8"/>
</svg>
