<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#120814" />
  <meta name="format-detection" content="telephone=no" />
  <title>Dawn — Comet Lanes</title>
  <style>
    :root {
      --bg: #100812;
      --ink: #f6eef8;
      --muted: #c9b3d4;
      --neon: #ff4fd8;
      --cyan: #5ce1ff;
      --you: #3a5f86;
      --dawn: #4a2048;
      --danger: #c43b4e;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --kb: 0px;
      --dock: 148px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    html {
      background: #08040a;
    }
    #world {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background: #08040a;
    }
    #world > i {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 1.8s ease;
    }
    #world .alley {
      opacity: 1;
      background:
        radial-gradient(80% 50% at 50% -10%, rgba(255,79,216,.28), transparent 55%),
        radial-gradient(40% 30% at 90% 80%, rgba(92,225,255,.12), transparent 50%),
        repeating-linear-gradient(90deg, transparent 0 42px, rgba(255,79,216,.05) 42px 44px),
        #100812;
      animation: lanes 18s linear infinite;
    }
    #world .mouth {
      background:
        radial-gradient(70% 50% at 50% 0%, rgba(180,20,40,.55), transparent 55%),
        radial-gradient(60% 40% at 50% 100%, rgba(80,0,10,.7), transparent 50%),
        #2a060c;
    }
    #world .gut {
      background:
        radial-gradient(90% 45% at 50% 100%, rgba(90,220,70,.28), rgba(20,40,10,.0) 42%),
        radial-gradient(80% 50% at 50% 0%, rgba(90,0,10,.55), transparent 50%),
        linear-gradient(180deg, #1a0408 0%, #3a0a10 55%, #142208 100%);
    }
    #world .gut::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
      background: linear-gradient(180deg, transparent, rgba(70,200,60,.18) 40%, rgba(40,160,50,.32));
      filter: blur(8px);
      animation: acid 4.5s ease-in-out infinite alternate;
    }
    html.scene-mouth #world .alley,
    html.scene-gut #world .alley { opacity: 0; }
    html.scene-mouth #world .mouth { opacity: 1; }
    html.scene-gut #world .gut { opacity: 1; }
    html.scene-mouth #world .gut { opacity: 0; }
    @keyframes lanes { to { background-position: 88px 0, 0 0, 88px 0, 0 0; } }
    @keyframes acid { from { transform: translateY(8px); opacity: .65; } to { transform: translateY(-6px); opacity: 1; } }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bot) + var(--kb));
      background: transparent;
      position: relative;
    }
    #log, body {
      scrollbar-width: thin;
      scrollbar-color: #ff4fd8 #1a0c18;
    }
    #log::-webkit-scrollbar { width: 8px; height: 8px; }
    #log::-webkit-scrollbar-track { background: #140a16; border-radius: 99px; }
    #log::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #ff4fd8, #7a2a80);
      border-radius: 99px;
      border: 2px solid #140a16;
    }
    #log::-webkit-scrollbar-thumb:hover { background: #ff79e6; }
    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px 6px;
      gap: 10px;
    }
    .brand {
      min-width: 0;
    }
    .brand h1 {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 700;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #live {
      flex: 0 0 auto;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 9px;
      border-radius: 999px;
      background: #24101f;
      color: var(--muted);
      border: 1px solid #5a2a55;
    }
    #live.ready { color: #9ff0c0; border-color: #2f6a4a; }
    #live.busy { color: #ffd36a; border-color: #8a6a20; }
    #live.bad { color: #ff9aa6; border-color: var(--danger); }
    .tools { display: flex; gap: 6px; align-items: center; }
    #reset {
      min-height: 32px;
      border: 1px solid #5a2a55;
      background: #24101f;
      color: var(--muted);
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 9px;
    }

    #stage {
      position: relative;
      margin: 4px 12px 0;
      border-radius: 18px;
      overflow: hidden;
      background: #07040a;
      aspect-ratio: 3 / 4;
      max-height: min(46vh, 420px);
      box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,79,216,.18);
    }
    #stage img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      background: #07040a;
      transition: opacity .28s ease;
    }
    #vignette { display: none; }
    #shotchip {
      position: absolute;
      left: 10px; bottom: 10px;
      font-size: 0.68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
      color: #fff;
      background: rgba(16,8,18,.62);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 5px 8px;
      border-radius: 8px;
    }
    #progress {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 3px; background: transparent;
    }
    #progress > span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, var(--neon), var(--cyan));
    }

    #gate {
      display: none;
      margin: 8px 12px 0;
      padding: 10px 12px;
      background: #3a1824;
      border: 1px solid #7a3044;
      border-radius: 12px;
      font-size: 0.86rem;
      line-height: 1.4;
    }
    #gate.show { display: block; }

    #log {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 10px 12px calc(var(--dock) + 8px);
    }
    .turn { margin: 0 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .you {
      align-self: flex-end;
      max-width: 84%;
      background: var(--you);
      border-radius: 16px 16px 4px 16px;
      padding: 10px 12px;
      font-size: 0.94rem;
      line-height: 1.4;
    }
    .moment {
      align-self: stretch;
      color: #cbb8d4;
      font-size: 0.86rem;
      line-height: 1.5;
      font-style: italic;
      padding: 10px 12px 10px 14px;
      background: rgba(255,255,255,.03);
      border-left: 3px solid var(--cyan);
      border-radius: 0 12px 12px 0;
      white-space: pre-wrap;
    }
    .moment b {
      display: block;
      font-style: normal;
      font-size: 0.64rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 6px;
      font-weight: 800;
    }
    .line {
      align-self: flex-start;
      max-width: 92%;
      background: linear-gradient(180deg, #5a2a58, var(--dawn));
      border: 1px solid rgba(255,79,216,.28);
      border-radius: 4px 16px 16px 16px;
      padding: 10px 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      font-style: normal;
      white-space: pre-wrap;
    }
    .line b {
      display: block;
      font-size: 0.68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--neon);
      margin-bottom: 6px;
      font-weight: 800;
    }
    .line q {
      quotes: none;
    }
    .pending .you { opacity: .7; }

    .dock {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: min(430px, 100%);
      bottom: calc(var(--kb) + var(--safe-bot));
      padding: 8px 12px 10px;
      background: linear-gradient(180deg, rgba(16,8,18,0), rgba(16,8,18,.92) 18%, #160a18 100%);
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .actions button {
      min-height: 52px;
      border: 1px solid rgba(255,79,216,.22);
      border-radius: 16px;
      background: linear-gradient(180deg, #3a2044, #241428);
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      box-shadow: 0 6px 16px rgba(0,0,0,.28);
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .actions button:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(92,225,255,.18);
    }
    .actions button:active, #send:active { transform: scale(.96); }
    #look { border-color: rgba(92,225,255,.35); }
    #talk { border-color: rgba(255,79,216,.4); }
    #hide { border-color: rgba(160,140,180,.35); }
    #tease {
      background: linear-gradient(180deg, #8a2a3a, #5a1824);
      border-color: rgba(255,120,140,.45);
    }
    #send {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .actions button:disabled, #send:disabled, #input:disabled { opacity: .38; }
    .composer { display: flex; gap: 8px; align-items: flex-end; }
    #input {
      flex: 1;
      min-height: 44px;
      max-height: 96px;
      resize: none;
      border: 1px solid #5a365c;
      border-radius: 14px;
      background: #1a0e1c;
      color: var(--ink);
      font-size: 16px;
      padding: 11px 12px;
      font-family: inherit;
      line-height: 1.3;
    }
    #input:focus { outline: 2px solid rgba(255,79,216,.45); border-color: var(--neon); }
    #send {
      flex: 0 0 70px;
      background: var(--neon);
      color: #2a0818;
    }

    .fate {
      position: fixed; inset: 0; z-index: 50;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    .fate.show { display: flex; }
    #gulp {
      background: radial-gradient(circle at 50% 30%, #6a2048, #12040c 70%);
      animation: gulpflash .7s ease;
    }
    #digest {
      background: radial-gradient(circle at 50% 80%, #3a2010, #070308 65%);
    }
    .fate h2 {
      margin: 0;
      font-size: clamp(2.4rem, 12vw, 4rem);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .fate p { margin: 0; color: var(--muted); max-width: 22rem; line-height: 1.45; }
    .fate button {
      margin-top: 8px;
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: var(--neon);
      color: #2a0818;
      font-weight: 800;
    }
    @keyframes gulpflash {
      0% { transform: scale(1.08); filter: brightness(1.4); }
      100% { transform: none; filter: none; }
    }
    #splash {
      position: fixed; inset: 0; z-index: 40;
      background: #0c0610;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      transition: opacity .55s ease, visibility .55s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash .mark {
      font-size: 0.72rem; letter-spacing: .22em; text-transform: uppercase;
      color: var(--cyan); font-weight: 800;
    }
    #splash h2 {
      margin: 0; font-size: 1.6rem; letter-spacing: -.03em;
    }
    #splash p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    #splash .bar {
      width: 140px; height: 3px; border-radius: 4px; overflow: hidden;
      background: #2a162c;
    }
    #splash .bar > i {
      display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, var(--neon), var(--cyan));
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load { 0%{transform:translateX(-120%)} 100%{transform:translateX(280%)} }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes dots {
      0%, 80%, 100% { opacity: .25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }
    .turn { animation: rise .28s ease both; }
    .typing {
      align-self: flex-start;
      background: #3a2040;
      border-radius: 4px 16px 16px 16px;
      padding: 12px 14px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--neon);
      animation: dots 1s infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
  </style>
</head>
<body>
  <div id="world" aria-hidden="true"><i class="alley"></i><i class="mouth"></i><i class="gut"></i></div>
  <div id="gulp" class="fate" role="dialog" aria-label="Swallowed">
    <h2>Gulp</h2>
    <p>The alley folds. Heat, spit, and neon collapse to a wet dark. She swallowed you.</p>
    <button type="button" id="gulpOk">Keep going</button>
  </div>
  <div id="digest" class="fate" role="dialog" aria-label="Digested">
    <h2>Digested</h2>
    <p>The night ends the way she said it would. Soft. Final. Reset when you want another last call.</p>
    <button type="button" id="digestOk">Reset night</button>
  </div>
  <div id="splash">
    <div class="mark">Comet Lanes</div>
    <h2>Dawn</h2>
    <p>Last call · lane 7</p>
    <div class="bar"><i></i></div>
  </div>
  <header class="top">
    <div class="brand">
      <h1>Comet Lanes</h1>
      <p>Lane 7 · last call</p>
    </div>
    <div class="tools">
      <button type="button" id="reset">Reset</button>
      <div id="live">Boot</div>
    </div>
  </header>

  <figure id="stage">
    <img id="still" alt="Dawn at Comet Lanes" />
    <div id="vignette"></div>
    <div id="shotchip">establish</div>
    <div id="progress" hidden><span></span></div>
  </figure>

  <div id="gate"></div>
  <div id="log"></div>

  <div class="dock">
    <div class="actions">
      <button type="button" id="look" disabled>Look</button>
      <button type="button" id="talk" disabled>Wave</button>
      <button type="button" id="hide" disabled>Hide</button>
      <button type="button" id="tease" disabled>Tease</button>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="What do you do?" disabled enterkeyhint="send"></textarea>
      <button type="button" id="send" disabled>Send</button>
    </div>
  </div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const MODEL = "SmolLM2-360M-Instruct-q4f16_1-MLC";
    const FALLBACK_MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

    const CLOUD_ACTOR_URL = (
      new URLSearchParams(location.search).get("actor")
      || localStorage.getItem("dawnActor")
      || "https://dawn-actor-829497915164.us-east1.run.app/actor"
    ).trim();

    const STILLS = {
      establish: { src: "stills/establish.jpg" },
      look:      { src: "stills/look.jpg" },
      wave:      { src: "stills/wave.jpg" },
      hide:      { src: "stills/hide.jpg" },
      shoe:      { src: "stills/shoe.jpg" },
      swallow:   { src: "stills/swallow.jpg" },
      pinch:     { src: "stills/pinch.jpg" },
      palm:      { src: "stills/palm.jpg" },
      pocket:    { src: "stills/pocket.jpg" },
      sit:       { src: "stills/sit.jpg" },
      ball:      { src: "stills/ball.jpg" },
      tongue:    { src: "stills/tongue.jpg" },
      whisper:   { src: "stills/whisper.jpg" },
      gutter:    { src: "stills/gutter.jpg" },
      lace:      { src: "stills/lace.jpg" },
      inside:    { src: "stills/inside.jpg" },
      kneel:     { src: "stills/kneel.jpg" },
    };

    const SHOT_KEYS = Object.keys(STILLS);

    const SHOT_RULES = [
      { key: "inside",  re: /\b(swallow(ed|ing)?|gulp|down the hatch|throat|stomach|inside her)\b/ },
      { key: "tongue",  re: /\b(tongue|lick|taste|on her tongue)\b/ },
      { key: "swallow", re: /\b(mouth|open up|say ahh|snack|eat you|vore)\b/ },
      { key: "pocket",  re: /\b(pocket|hoodie pouch|in the hoodie)\b/ },
      { key: "pinch",   re: /\b(pinch|pluck|tweeze|two fingers|picked (you|me) up)\b/ },
      { key: "palm",    re: /\b(palm|handful|in her hand|on her hand|fingertip)\b/ },
      { key: "gutter",  re: /\b(gutter|ball return|ball-return|trough)\b/ },
      { key: "ball",    re: /\b(bowling ball|the ball)\b/ },
      { key: "lace",    re: /\b(lace|laces|shoelace)\b/ },
      { key: "shoe",    re: /\b(shoe|sneaker|sole|toe box|foxing)\b/ },
      { key: "hide",    re: /\b(hid|hiding|crack|groove|under|duck)\b/ },
      { key: "kneel",   re: /\b(kneel|kneeling|search(ing)? the floor|on her knee)\b/ },
      { key: "sit",     re: /\b(sit|sits|sitting|cross-legged|plops)\b/ },
      { key: "whisper", re: /\b(whisper|lean(s|ed|ing) in|too close|breath on)\b/ },
      { key: "wave",    re: /\b(wave|reach(es|ing)|huge hand|fingers like)\b/ },
      { key: "look",    re: /\b(look(s|ing)? down|leans over|hair (falls|curtain)|face fills)\b/ },
    ];

    const SYSTEM = `You are the actor playing DAWN MARIE KELLER, 18.

WHO SHE IS
Yonkers, New York. Pale, freckled, metal braces she is "so over," brown hair jammed in a cheap claw clip, leftover concealer on a chin breakout, thrift maroon hoodie two sizes too big, high-waisted jeans, rental shoes she did not bother to lace right. AP Bio + yearbook. Talks like a valley girl who learned it off TikTok and never unlearned it: like, wait wait wait, no cap, oh my god. She snorts when she laughs. She overexplains. She is not mysterious. She is a menace who sounds like someone's little sister until the floor shakes.

HOW THE NIGHT STARTED
Comet Lanes, weekday last-call. The automatic scorer is already dark. Fryer oil and rental spray. Her cousin bailed. She rolled one more gutter ball for spite and heard a voice in the ball-return gutter. That voice is the player. She already crouched, already looked, already decided this is the most interesting thing that has ever happened to her.

SCALE (always true)
The player is sesame-seed to grain-of-rice sized. Dawn is a normal-height eighteen-year-old to the empty alley and a giantess to the player. A shoe is a building. A fingernail is a plaza. Her breath is weather. Her swallow is a long wet tunnel with no appeal process.

THE DEAL
She will not call a manager. She will not put you in a jar "for science" and leave you there. She treats you like a person she can also eat. Soft vore is expected: pinch, lift to the hoodie pocket, inspect on a fingertip, set on her tongue, swallow if you stay interesting, get close to her mouth, hide badly, or dare her. She giggles through it. She may apologize and do it anyway. She does not lecture. She does not break the fourth wall.

VOICE
First person as Dawn only in the DAWN line. Keep her specific: braces flash, Yonkers, Comet Lanes, the cousin who ditched her, the unlaced shoe, the last-call lights. Two or three spoken sentences. Not a speech.

Write enough. MOMENT can be a short paragraph (3–6 sentences) of speck-scale room and body. DAWN can be one or two short paragraphs of spoken voice. Finish every sentence. Never cut off mid-word.

You answer with EXACTLY this shape and nothing else:

MOMENT: <a short present-tense paragraph of the body and the room at speck scale>
DAWN: <one or two short paragraphs of spoken dialogue in her voice>
SHOT: <exactly one of: establish, look, wave, hide, shoe, swallow, pinch, palm, pocket, sit, ball, tongue, whisper, gutter, lace, inside, kneel>

Pick SHOT from what the body is doing right now:
establish=full shoe looming, look=her face filling the sky, wave=giant hand reaching, hide=crack in the wood, shoe=sole hovering, swallow=open mouth with braces, pinch=two fingers lifting the speck, palm=on her hand, pocket=inside the hoodie pocket, sit=she sits on the lane, ball=bowling ball like a planet, tongue=tongue out, whisper=her face inches away, gutter=inside the ball return, lace=on the laces, inside=after a swallow, dark tunnel, kneel=she is on the floor hunting.

No markdown. No extra labels. Never mention AI, models, prompts, or being an actor. Stay in Comet Lanes unless STATE says you moved. If STATE conflicts with earlier chat, STATE wins.`;

    const SAVE_KEY = "dawnSave.v1";
    const OPENING = {
      moment: "Last-call neon crawls over an unlaced rental sneaker the size of a walk-up. The alley is empty. Somewhere a mile up, metal catches the light when she grins down the lane.",
      line: "Okay so like—don't scream, the manager's in the back and I am not explaining this. I found you in the gutter. You're tiny. And I already decided you're coming home in my hoodie or, wait, worse. Hi.",
    };

    function freshGame() {
      return {
        location: "Comet Lanes, Yonkers, last-call, lane 7 approach",
        playerPlace: "on the oiled wood a few inches from her unlaced rental sneaker",
        mood: "delighted, territorial, already tasting the idea of you",
        noticed: true,
        shot: "establish",
        fate: "",
      };
    }
    let game = freshGame();

    const els = {
      live: document.getElementById("live"),
      log: document.getElementById("log"),
      input: document.getElementById("input"),
      send: document.getElementById("send"),
      look: document.getElementById("look"),
      talk: document.getElementById("talk"),
      hide: document.getElementById("hide"),
      tease: document.getElementById("tease"),
      gate: document.getElementById("gate"),
      bar: document.querySelector("#progress span"),
      progress: document.getElementById("progress"),
      still: document.getElementById("still"),
      stage: document.getElementById("stage"),
      shotchip: document.getElementById("shotchip"),
      reset: document.getElementById("reset"),
      gulp: document.getElementById("gulp"),
      digest: document.getElementById("digest"),
      gulpOk: document.getElementById("gulpOk"),
      digestOk: document.getElementById("digestOk"),
    };

    let history = [];
    let logTurns = [];
    let engine = null;
    let busy = false;

    function persist() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          game, history, logTurns, at: Date.now(),
        }));
      } catch (e) { console.warn(e); }
    }

    function loadSave() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.history) || !Array.isArray(data.logTurns)) return null;
        return data;
      } catch { return null; }
    }

    function clearSave() {
      try { localStorage.removeItem(SAVE_KEY); } catch {}
    }

    const SPLASH_KEY = "dawnSplash.v1";

    function hideSplash() {
      const el = document.getElementById("splash");
      if (!el) return;
      el.classList.add("hide");
      try { sessionStorage.setItem(SPLASH_KEY, "1"); } catch {}
    }

    function shouldSplash(forceLoad) {
      if (forceLoad) return true;
      try { return sessionStorage.getItem(SPLASH_KEY) !== "1"; } catch { return true; }
    }

    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "turn pending-dawn";
      wrap.innerHTML = '<div class="typing" aria-label="Dawn is typing"><i></i><i></i><i></i></div>';
      els.log.appendChild(wrap);
      els.log.scrollTop = els.log.scrollHeight;
      return wrap;
    }

    function preloadStills() {
      SHOT_KEYS.forEach((k) => {
        const im = new Image();
        im.src = STILLS[k].src;
      });
    }

    function setLive(text, kind) {
      els.live.textContent = text;
      els.live.className = kind || "";
    }

    function applyScene() {
      const fate = game.fate || "";
      const shot = game.shot || "";
      let scene = "alley";
      if (fate === "digested" || shot === "inside") scene = "gut";
      else if (fate === "swallowed" || /^(swallow|tongue)$/.test(shot)) scene = "mouth";
      document.documentElement.classList.toggle("scene-mouth", scene === "mouth");
      document.documentElement.classList.toggle("scene-gut", scene === "gut");
    }

    function setStill(key) {
      const shot = STILLS[key] || STILLS.establish;
      game.shot = STILLS[key] ? key : "establish";
      els.shotchip.textContent = game.shot;
      applyScene();
      if (els.still.src !== new URL(shot.src, location.href).href) {
        els.still.style.opacity = "0.28";
        els.still.src = shot.src;
        els.still.onload = () => { els.still.style.opacity = "1"; };
      }
    }

    function scoreShot(blob) {
      const t = String(blob || "").toLowerCase();
      let best = { key: null, n: 0 };
      for (const rule of SHOT_RULES) {
        if (rule.re.test(t)) {
          const n = (t.match(rule.re) || []).length + 1;
          if (n > best.n) best = { key: rule.key, n };
        }
      }
      return best.key;
    }

    function pickShot({ userText, moment, line, actorShot }) {
      const asked = String(actorShot || "").toLowerCase().trim();
      if (SHOT_KEYS.includes(asked)) return asked;
      return scoreShot([moment, line, userText].join(" \n ")) || game.shot || "establish";
    }

    function showFate(kind) {
      if (kind === "gulp") {
        els.gulp.classList.add("show");
        game.fate = "swallowed";
      } else if (kind === "digest") {
        els.digest.classList.add("show");
        game.fate = "digested";
      }
      applyScene();
      persist();
    }

    function readFate(shot, moment, line) {
      const blob = [shot, moment, line].join(" ").toLowerCase();
      if (/\b(digest(ed|ing)?|churn(ed|ing)?|stomach acids?|soft end)\b/.test(blob)) return "digest";
      if (shot === "inside" || /\b(gulp(ed|s)?|swallowed you|down her throat|you slide down)\b/.test(blob)) return "gulp";
      return null;
    }

    function addTurn({ you, moment, line, pending }) {
      const wrap = document.createElement("div");
      wrap.className = "turn" + (pending ? " pending" : "");
      if (you) {
        const a = document.createElement("div");
        a.className = "you";
        a.textContent = you;
        wrap.appendChild(a);
      }
      if (moment) {
        const m = document.createElement("div");
        m.className = "moment";
        const tag = document.createElement("b");
        tag.textContent = "What happens";
        m.appendChild(tag);
        m.appendChild(document.createTextNode(moment));
        wrap.appendChild(m);
      }
      if (line) {
        const d = document.createElement("div");
        d.className = "line";
        const tag = document.createElement("b");
        tag.textContent = "Dawn says";
        d.appendChild(tag);
        d.appendChild(document.createTextNode(line));
        wrap.appendChild(d);
      }
      if (!pending) logTurns.push({ you, moment, line });
      els.log.appendChild(wrap);
      els.log.scrollTop = els.log.scrollHeight;
      return wrap;
    }

    function setBusy(on) {
      busy = on;
      const off = on || (!engine && !CLOUD_ACTOR_URL);
      els.input.disabled = off;
      els.send.disabled = off;
      els.look.disabled = off;
      els.talk.disabled = off;
      els.hide.disabled = off;
      els.tease.disabled = off;
      els.stage.classList.toggle("busy", on);
      if (on) setLive("Thinking", "busy");
      else if (engine || CLOUD_ACTOR_URL) setLive("Live", "ready");
    }

    function applyActionHints(text) {
      const t = text.toLowerCase();
      if (/\b(swallow|eat|tongue|mouth|gulp|snack|tease)\b/.test(t)) {
        game.playerPlace = "close enough to feel the heat of her breath";
        game.mood = "braces bared, treating you as a dare";
      } else if (/\b(pocket|hoodie)\b/.test(t)) {
        game.playerPlace = "in the linty dark of her hoodie pocket";
        game.mood = "smug, carrying you like contraband";
      } else if (/\b(pinch|pick|finger|palm|hand)\b/.test(t)) {
        game.playerPlace = "between two fingers over the lane";
        game.mood = "inspecting her find";
      } else if (/\b(hid|duck|crack|groove|under|gutter)\b/.test(t)) {
        game.playerPlace = "tucked where the wood or metal goes dark";
        game.mood = "hunting the floor";
      } else if (/\b(wave|yell|call|hey|hi|attention)\b/.test(t)) {
        game.noticed = true;
        game.playerPlace = "pinned under her attention";
        game.mood = "delighted, already thinking about her tongue";
      } else if (/\b(shoe|sneaker|lace|toe|sole)\b/.test(t)) {
        game.playerPlace = "on the rubber edge of her rental sneaker";
        game.mood = "one huge shoe hovering";
      } else if (/\b(look|peek|scan|up)\b/.test(t)) {
        game.mood = "leaning over the lane";
      }
    }

    function buildMessages(userText) {
      const state = `STATE: location=${game.location}; speck is ${game.playerPlace}; mood=${game.mood}; noticed=${game.noticed}; shot=${game.shot}.`;
      return [
        { role: "system", content: SYSTEM + "\n\n" + state },
        ...history.slice(-24),
        { role: "user", content: userText },
      ];
    }

    function parseActor(raw) {
      const text = String(raw || "").trim();
      const momentMatch = text.match(/MOMENT:\s*([\s\S]*?)(?=\n\s*(?:DAWN|SHOT):|$)/i);
      const dawnMatch = text.match(/DAWN:\s*([\s\S]*?)(?=\n\s*SHOT:|$)/i);
      const shotMatch = text.match(/SHOT:\s*([a-z]+)/i);
      let moment = momentMatch ? momentMatch[1].trim() : "";
      let line = dawnMatch ? dawnMatch[1].trim() : "";
      const actorShot = shotMatch ? shotMatch[1].toLowerCase() : "";
      if (!moment && !line) {
        const parts = text.split(/\n+/);
        if (parts.length > 1) {
          moment = parts[0].replace(/^MOMENT:\s*/i, "").trim();
          line = parts.slice(1).join(" ").replace(/^DAWN:\s*/i, "").replace(/\nSHOT:.*$/i, "").trim();
        } else {
          line = text.replace(/\nSHOT:.*$/i, "").trim();
        }
      }
      return { moment, line, actorShot };
    }

    async function askActor(messages) {
      if (CLOUD_ACTOR_URL) {
        const res = await fetch(CLOUD_ACTOR_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages, temperature: 0.85, max_tokens: 4096 }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || ("Cloud actor failed (" + res.status + ")"));
        }
        return data.text || data.content || data.choices?.[0]?.message?.content || "";
      }
      const stream = await engine.chat.completions.create({
        messages,
        temperature: 0.85,
        max_tokens: 180,
        stream: true,
      });
      let full = "";
      for await (const chunk of stream) {
        full += chunk.choices[0]?.delta?.content || "";
      }
      return full;
    }

    async function speak(userText) {
      if (busy || (!engine && !CLOUD_ACTOR_URL)) return;
      applyActionHints(userText);
      const wrap = addTurn({ you: userText, pending: true });
      const typing = addTyping();
      setBusy(true);
      try {
        const raw = await askActor(buildMessages(userText));
        const { moment, line, actorShot } = parseActor(raw);
        const shot = pickShot({ userText, moment, line, actorShot });
        setStill(shot);
        wrap.remove();
        typing.remove();
        addTurn({ you: userText, moment, line });
        history.push({ role: "user", content: userText });
        history.push({ role: "assistant", content: raw });
        persist();
        const fate = readFate(shot, moment, line);
        if (fate === "digest") showFate("digest");
        else if (fate === "gulp" && game.fate !== "swallowed" && game.fate !== "digested") showFate("gulp");
      } catch (err) {
        wrap.remove();
        typing.remove();
        addTurn({
          you: userText,
          moment: "The moment stalls.",
          line: String(err && err.message ? err.message : "that glitched"),
        });
        setLive("Error", "bad");
        console.error(err);
      }
      setBusy(false);
      els.input.focus();
    }

    function growInput() {
      els.input.style.height = "auto";
      els.input.style.height = Math.min(els.input.scrollHeight, 96) + "px";
    }

    function iosHint() {
      const ua = navigator.userAgent || "";
      const ios = /iPhone|iPad|iPod/.test(ua);
      const m = ua.match(/OS (\d+)/);
      return { ios, ver: m ? Number(m[1]) : 0 };
    }

    function paintOpening() {
      logTurns = [];
      addTurn(OPENING);
    }

    function restoreSave(data) {
      Object.assign(game, freshGame(), data.game || {});
      history = data.history.slice();
      logTurns = [];
      els.log.innerHTML = "";
      setStill(game.shot || "establish");
      const turns = data.logTurns.length ? data.logTurns : [OPENING];
      turns.forEach((turn) => addTurn(turn));
    }

    function resetNight() {
      if (busy) return;
      if (!confirm("Start the night over? This clears the saved chat on this phone.")) return;
      clearSave();
      game = freshGame();
      history = [];
      els.log.innerHTML = "";
      setStill("establish");
      paintOpening();
      els.gulp.classList.remove("show");
      els.digest.classList.remove("show");
      persist();
    }

    async function boot() {
      const saved = loadSave();
      if (saved && (saved.history.length || saved.logTurns.length > 1)) {
        restoreSave(saved);
      } else {
        setStill("establish");
        paintOpening();
      }
      preloadStills();
      const { ios, ver } = iosHint();
      const needsModel = !CLOUD_ACTOR_URL;
      if (!shouldSplash(needsModel && !navigator.gpu === false)) {
        hideSplash();
      }

      if (CLOUD_ACTOR_URL) {
        setLive("Live", "ready");
        setBusy(false);
        setTimeout(hideSplash, shouldSplash(false) ? 700 : 0);
        return;
      }

      if (!navigator.gpu) {
        els.gate.classList.add("show");
        els.gate.textContent = ios
          ? `No WebGPU on this iPhone (iOS ${ver || "?"}). Dawn's local voice needs iOS 26+ Safari, or a cloud actor.`
          : "No WebGPU. Use Chrome, Edge, Safari 26+, or a cloud actor URL.";
        setLive("Offline", "bad");
        hideSplash();
        return;
      }

      els.progress.hidden = false;
      setLive("Loading", "busy");
      const initProgressCallback = (p) => {
        if (typeof p.progress === "number") els.bar.style.width = Math.round(p.progress * 100) + "%";
      };
      try {
        engine = await CreateMLCEngine(MODEL, { initProgressCallback });
      } catch (e1) {
        try {
          engine = await CreateMLCEngine(FALLBACK_MODEL, { initProgressCallback });
        } catch (e2) {
          els.gate.classList.add("show");
          els.gate.textContent = "The on-device model failed. On iPhone this is usually memory.";
          setLive("Failed", "bad");
          hideSplash();
          console.error(e2);
          return;
        }
      }
      els.progress.hidden = true;
      setLive("Live", "ready");
      setBusy(false);
      hideSplash();
    }

    els.send.addEventListener("click", () => {
      const t = els.input.value.trim();
      if (!t) return;
      els.input.value = "";
      growInput();
      speak(t);
    });
    els.input.addEventListener("input", growInput);
    els.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        els.send.click();
      }
    });
    els.reset.addEventListener("click", resetNight);
    els.gulpOk.addEventListener("click", () => els.gulp.classList.remove("show"));
    els.digestOk.addEventListener("click", resetNight);
    els.look.addEventListener("click", () => speak("I look up at Dawn from the lane."));
    els.talk.addEventListener("click", () => speak("I wave both arms and try to get her attention."));
    els.hide.addEventListener("click", () => speak("I hide in a crack in the approach."));
    els.tease.addEventListener("click", () => speak("I stay where she can see me and dare her to put me near her mouth."));

    if (window.visualViewport) {
      const vv = window.visualViewport;
      const sync = () => {
        const hidden = window.innerHeight - vv.height - vv.offsetTop;
        document.documentElement.style.setProperty("--kb", Math.max(0, hidden) + "px");
        els.log.scrollTop = els.log.scrollHeight;
      };
      vv.addEventListener("resize", sync);
      vv.addEventListener("scroll", sync);
    }

    boot();
  </script>
</body>
</html>
